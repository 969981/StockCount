name: StockCount Release - Android Debug and Release APK, Setup, Portable
# Both APK variants need separate signing identities. Publish only with a complete signed asset set.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (for example 0.2.0-preview.3)'
        required: true
        type: string
        default: '0.2.0-preview.3'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-stockcount.yml'
      - 'scripts/package-windows-portable.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/build-avalonia-desktop.ps1'
      - 'scripts/build-local.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'assets/branding/**'
      - 'desktop/server-console/assets/app-icon.svg'
      - 'src/StockCount.Pad/Resources/AppIcon/**'
      - 'src/StockCount.Pad/Platforms/Android/AndroidManifest.xml'
      - 'scripts/verify-android-launcher-icon.ps1'
      - 'scripts/prepare-windows-brand-icons.ps1'
      - 'scripts/build-android-release.ps1'
  pull_request:
    paths:
      - '.github/workflows/publish-stockcount.yml'
      - 'scripts/package-windows-portable.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/build-avalonia-desktop.ps1'
      - 'scripts/build-local.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'assets/branding/**'
      - 'desktop/server-console/assets/app-icon.svg'
      - 'src/StockCount.Pad/Resources/AppIcon/**'
      - 'src/StockCount.Pad/Platforms/Android/AndroidManifest.xml'
      - 'scripts/verify-android-launcher-icon.ps1'
      - 'scripts/prepare-windows-brand-icons.ps1'
      - 'scripts/build-android-release.ps1'

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version || '0.2.0-preview.3' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and reject publishing from non-main branches
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual publishing is restricted to the main branch" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+(\.[A-Za-z0-9]+)*)?$ ]]; then
            echo "Invalid Release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          app_version="$(jq -r '.version' desktop/server-console/src-tauri/tauri.conf.json)"
          if [[ "$RELEASE_VERSION" != "$app_version" && "$RELEASE_VERSION" != "$app_version"-* ]]; then
            echo "Release label $RELEASE_VERSION conflicts with actual software version $app_version." >&2
            echo "First run scripts/set-app-version.ps1 and commit all project metadata." >&2
            exit 1
          fi
          echo "Validated StockCount app version: $app_version; release label: $RELEASE_VERSION"
  android:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Test counting business rules
        run: dotnet test tests/StockCount.Core.Tests/StockCount.Core.Tests.csproj -c Release
      - name: Build signed debug APK
        shell: pwsh
        run: |
          dotnet build src/StockCount.Pad/StockCount.Pad.csproj -f net10.0-android -c Debug -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
          if ($LASTEXITCODE -ne 0) { throw "MAUI Android build failed" }
      - name: Stage only signed Debug APK
        shell: pwsh
        run: |
          $path = "src/StockCount.Pad/bin/Debug/net10.0-android"
          $signed = @(Get-ChildItem $path -File -Filter "*-Signed.apk")
          if ($signed.Count -ne 1) { throw "Expected one signed APK, got $($signed.Count)" }
          ./scripts/verify-android-launcher-icon.ps1 -ApkPath $signed[0].FullName
          New-Item -ItemType Directory release-android -Force | Out-Null
          $dest = "release-android/StockCount-PDA-v$env:RELEASE_VERSION-Android-Debug-Signed.apk"
          Copy-Item -LiteralPath $signed[0].FullName -Destination $dest
          if ((Get-Item $dest).Length -lt 1048576) { throw "APK unexpectedly small" }
          Get-FileHash $dest -Algorithm SHA256 | Format-List
      - name: Check persistent Android Release signing configuration
        id: android_signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.STOCKCOUNT_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.STOCKCOUNT_ANDROID_KEY_ALIAS }}
          STOCKCOUNT_ANDROID_STORE_PASS: ${{ secrets.STOCKCOUNT_ANDROID_STORE_PASS }}
          STOCKCOUNT_ANDROID_KEY_PASS: ${{ secrets.STOCKCOUNT_ANDROID_KEY_PASS }}
        run: |
          $ready = -not [string]::IsNullOrWhiteSpace($env:RELEASE_KEYSTORE_BASE64) -and
                   -not [string]::IsNullOrWhiteSpace($env:RELEASE_KEY_ALIAS) -and
                   -not [string]::IsNullOrWhiteSpace($env:STOCKCOUNT_ANDROID_STORE_PASS) -and
                   -not [string]::IsNullOrWhiteSpace($env:STOCKCOUNT_ANDROID_KEY_PASS)
          "configured=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $ready) {
            Write-Warning "Release signing secrets not configured. Compile Release for QA, but do not publish an unsigned APK. Full GitHub Release will be blocked until credentials are configured."
          }
      - name: Compile Android Release configuration (non-distributable QA)
        if: steps.android_signing.outputs.configured != 'true'
        shell: pwsh
        run: |
          dotnet build src/StockCount.Pad/StockCount.Pad.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -p:AndroidKeyStore=false
          if ($LASTEXITCODE -ne 0) { throw "Android Release compilation failed" }
      - name: Build, sign and verify Android Release APK
        if: steps.android_signing.outputs.configured == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.STOCKCOUNT_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.STOCKCOUNT_ANDROID_KEY_ALIAS }}
          STOCKCOUNT_ANDROID_STORE_PASS: ${{ secrets.STOCKCOUNT_ANDROID_STORE_PASS }}
          STOCKCOUNT_ANDROID_KEY_PASS: ${{ secrets.STOCKCOUNT_ANDROID_KEY_PASS }}
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP 'stockcount-release.jks'
          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:RELEASE_KEYSTORE_BASE64))
            ./scripts/build-android-release.ps1 -Version $env:RELEASE_VERSION -KeyStore $keystore -KeyAlias $env:RELEASE_KEY_ALIAS -OutputDirectory release-android
          } finally {
            Remove-Item -LiteralPath $keystore -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: StockCount-Release-Android
          path: release-android/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build C# API
        run: |
          dotnet build src/StockCount.Api/StockCount.Api.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "ASP.NET build failed" }
      - name: Publish self-contained API Sidecar
        run: ./scripts/build-tauri-sidecar.ps1
      - name: Restore JS dependencies
        working-directory: desktop/server-console
        run: npm install
      - name: Generate desktop icon
        working-directory: desktop/server-console
        run: npm run tauri -- icon ./assets/app-icon.svg
      - name: Build Tauri NSIS installer and EXE
        working-directory: desktop/server-console
        run: npm run build:desktop
      - name: Stage Setup and portable ZIP
        run: |
          New-Item -ItemType Directory release-windows -Force | Out-Null
          $setup = @(Get-ChildItem "desktop/server-console/src-tauri/target/release/bundle/nsis" -File -Filter "*.exe")
          if ($setup.Count -ne 1) { throw "Expected exactly one NSIS installer, got $($setup.Count)" }
          $dest = "release-windows/StockCount-Server-v$env:RELEASE_VERSION-Windows-x64-Setup.exe"
          Copy-Item -LiteralPath $setup[0].FullName -Destination $dest
          if ((Get-Item $dest).Length -lt 1048576) { throw "Installer unexpectedly small" }
          ./scripts/package-windows-portable.ps1 -Version $env:RELEASE_VERSION -OutputDirectory "release-windows"
          $zip = "release-windows/StockCount-Server-v$env:RELEASE_VERSION-Windows-x64-Portable.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Portable ZIP missing" }
          Get-FileHash $dest -Algorithm SHA256 | Format-List
          Get-FileHash $zip -Algorithm SHA256 | Format-List
      - name: Build and package branded Avalonia Windows Portable
        shell: pwsh
        run: |
          ./scripts/build-avalonia-desktop.ps1 -Configuration Release
          if (-not $?) { throw "Avalonia Windows build failed" }
          ./scripts/package-avalonia-portable.ps1 -Version $env:RELEASE_VERSION -OutputDirectory 'release-windows'
          if (-not $?) { throw "Avalonia Portable packager failed" }
          $zip = "release-windows/StockCount-Avalonia-v$env:RELEASE_VERSION-Windows-x64-Portable.zip"
          if (!(Test-Path -LiteralPath $zip)) { throw "Avalonia Portable ZIP missing" }
          Get-FileHash -LiteralPath $zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: StockCount-Release-Windows
          path: |
            release-windows/*.exe
            release-windows/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish both signed APK variants, Windows binaries (including Avalonia) and SHA256
    needs: [validate, android, windows]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[publish-stockcount]'))
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StockCount-Release-Android
          path: release-android
      - uses: actions/download-artifact@v4
        with:
          name: StockCount-Release-Windows
          path: release-windows
      - name: Validate five binaries (two signed APKs) and hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          cp release-android/*.apk release-files/
          cp release-windows/*.exe release-windows/*.zip release-files/
          shopt -s nullglob
          debug_apk=(release-files/*-Android-Debug-Signed.apk)
          release_apk=(release-files/*-Android-Release-Signed.apk)
          setup=(release-files/*-Windows-x64-Setup.exe)
          portable=(release-files/StockCount-Server-v*-Windows-x64-Portable.zip)
          avalonia=(release-files/*-Avalonia-*-Windows-x64-Portable.zip)
          if (( ${#debug_apk[@]} != 1 || ${#release_apk[@]} != 1 || ${#setup[@]} != 1 || ${#portable[@]} != 1 || ${#avalonia[@]} != 1 )); then
            echo "Missing assets (release signing requires four GitHub Secrets): Debug=${#debug_apk[@]} Release=${#release_apk[@]} Setup=${#setup[@]} Portable=${#portable[@]} Avalonia=${#avalonia[@]}" >&2
            exit 1
          fi
          cd release-files
          sha256sum ./*.apk ./*.exe ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create a single immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace a published binary." >&2
            exit 1
          fi
          cat > /tmp/stockcount-notes.md <<'NOTES'
          ## StockCount - Android PDA and Windows Server Manager

          - Android Debug-Signed.apk: debug-signed APK for PDA debugging, not a production signing certificate.
          - Android Release-Signed.apk: optimized Release build signed by the persistent StockCount release keystore supplied via GitHub Secrets.
          - Windows Setup.exe: NSIS current-user installer with Tauri 2 manager and self-contained .NET 10 Sidecar.
          - Windows Portable.zip: extract all files to a writable directory, then run Start-StockCount.cmd.
          - Windows Avalonia Portable.zip: self-contained .NET native manager plus API; run Start-StockCount-Avalonia.cmd; upgrades via scripts/deploy-local.ps1 -Target AvaloniaPortable.
          - SHA256SUMS.txt: independent checksums of all five release binaries (two APK variants, Tauri Setup/Portable and Avalonia Portable).

          Windows non-secret settings (server-settings.json), logs (server-logs.db and SQLite WAL companions) live beside the desktop EXE, not in LOCALAPPDATA. The portable ZIP does not include user settings; if no colocated JSON exists, the first launch copies valid legacy AppData settings while leaving the old file untouched. SQL passwords and PDA device keys remain in Windows Credential Manager and do not migrate between user accounts or machines. Install/extract into a user-writable folder. Tauri requires WebView2 runtime; Avalonia does not.

          The XTEST and COB APIs both support controlled writes, but each write switch starts disabled until the administrator validates the ERP schema. This preview includes both Android Debug and signed Release APKs and upgrades the SQLite native bundle to a patched line (Microsoft.Data.Sqlite 10.0.14 and SQLitePCLRaw.bundle_e_sqlite3 2.1.14) following a NU1903 advisory detected in the preceding preview. This is a technical prerelease, not production certification; Windows executables are unsigned; the Android Debug APK uses a debug identity, while the Android Release APK requires a separate persistent production signing key. They cannot replace each other in-place.
          NOTES
          gh release create "$tag" release-files/*.apk release-files/*.exe release-files/*.zip release-files/SHA256SUMS.txt --repo "$GH_REPO" --target "$GIT_SHA" --title "StockCount v${RELEASE_VERSION} - Debug + Release APK / Setup / Tauri + Avalonia Portable" --notes-file /tmp/stockcount-notes.md --prerelease
