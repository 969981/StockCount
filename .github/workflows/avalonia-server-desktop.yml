name: StockCount Avalonia desktop Windows build
on:
  push:
    branches: [main, feat/avalonia-server-console-p0-p1]
    paths:
      - 'src/StockCount.Server.Desktop/**'
      - 'src/StockCount.Server.Hosting/**'
      - 'tests/StockCount.Server.Hosting.Tests/**'
      - 'scripts/build-avalonia-desktop.ps1'
      - '.github/workflows/avalonia-server-desktop.yml'
  pull_request:
    paths:
      - 'src/StockCount.Server.Desktop/**'
      - 'src/StockCount.Server.Hosting/**'
      - 'tests/StockCount.Server.Hosting.Tests/**'
      - 'scripts/build-avalonia-desktop.ps1'
      - '.github/workflows/avalonia-server-desktop.yml'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile, test and stage standalone Avalonia desktop plus API
        shell: pwsh
        run: ./scripts/build-avalonia-desktop.ps1 -Configuration Release
      - name: Upload internal QA build
        uses: actions/upload-artifact@v4
        with:
          name: StockCount-Avalonia-Win-x64-Internal-QA
          path: publish/avalonia-desktop/
          if-no-files-found: error
          retention-days: 7
