name: StockCount Avalonia desktop Windows build
on:
  push:
    branches: [main, feat/avalonia-server-console-p0-p1]
    paths:
      - 'src/StockCount.Server.Desktop/**'
      - 'src/StockCount.Server.Hosting/**'
      - 'src/StockCount.Api/**'
      - 'tests/ApiManagerLifetime.Smoke.ps1'
      - 'tests/StockCount.Server.Hosting.Tests/**'
      - 'scripts/build-avalonia-desktop.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'scripts/deploy-local.ps1'
      - 'scripts/prepare-windows-brand-icons.ps1'
      - 'assets/branding/**'
      - 'desktop/server-console/assets/app-icon.svg'
      - '.github/workflows/avalonia-server-desktop.yml'
  pull_request:
    paths:
      - 'src/StockCount.Server.Desktop/**'
      - 'src/StockCount.Server.Hosting/**'
      - 'src/StockCount.Api/**'
      - 'tests/ApiManagerLifetime.Smoke.ps1'
      - 'tests/StockCount.Server.Hosting.Tests/**'
      - 'scripts/build-avalonia-desktop.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'scripts/deploy-local.ps1'
      - 'scripts/prepare-windows-brand-icons.ps1'
      - 'assets/branding/**'
      - 'desktop/server-console/assets/app-icon.svg'
      - '.github/workflows/avalonia-server-desktop.yml'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Avalonia Debug from a clean source ZIP (no Git or npm needed)
        shell: pwsh
        run: |
          ./scripts/package-source.ps1 -OutputDirectory "$env:RUNNER_TEMP/stockcount-source-test"
          $short = (& git rev-parse --short=7 HEAD).Trim()
          $name = "StockCount-Source-$short"
          $zip = "$env:RUNNER_TEMP/stockcount-source-test/$name.zip"
          $extract = "$env:RUNNER_TEMP/stockcount-extracted"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $source = Join-Path $extract $name
          if (Test-Path (Join-Path $source '.git')) { throw 'Source archive unexpectedly includes Git metadata' }
          if (!(Test-Path (Join-Path $source 'src/StockCount.Server.Desktop/Assets/server.ico'))) {
            throw 'Source ZIP lacks the tracked native icon'
          }
          dotnet build (Join-Path $source 'src/StockCount.Server.Desktop/StockCount.Server.Desktop.csproj') -c Debug
          if ($LASTEXITCODE -ne 0) { throw 'Extracted source ZIP Avalonia Debug build failed' }
          if (!(Test-Path (Join-Path $source 'src/StockCount.Server.Desktop/bin/Debug/net10.0-windows/StockCount.Api.exe'))) {
            throw 'Extracted Debug build did not stage the API'
          }
      - name: Compile, test and stage framework-dependent Avalonia desktop plus API
        shell: pwsh
        run: ./scripts/build-avalonia-desktop.ps1 -Configuration Release
      - name: Assert two lean single-file EXEs and smoke launch Avalonia UI
        shell: pwsh
        run: |
          $dir = 'publish/avalonia-desktop'
          $files = @(Get-ChildItem -LiteralPath $dir -Force)
          if ($files.Count -ne 2 -or @($files | Where-Object { $_.PSIsContainer -or $_.Name -notin @('StockCount.Server.Desktop.exe','StockCount.Api.exe') }).Count) {
            throw 'Expected precisely two executable bundles'
          }
          $runtimes = (& dotnet --list-runtimes) | Out-String
          if ($runtimes -notmatch 'Microsoft\.NETCore\.App 10\.' -or $runtimes -notmatch 'Microsoft\.AspNetCore\.App 10\.') {
            throw 'The x64 .NET 10 and ASP.NET Core 10 shared runtimes are required.'
          }
          $baseline = 106086884 + 113463323
          $actual = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host "Framework-dependent size: $actual bytes; prior self-contained baseline: $baseline bytes"
          if ($actual -ge $baseline) { throw 'Framework-dependent bundles did not shrink relative to prior self-contained build.' }
          $fixture = Join-Path $env:RUNNER_TEMP ('avalonia-ui-smoke-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $ui = $null
          try {
            Copy-Item -Path "$dir/*.exe" -Destination $fixture
            $ui = Start-Process -FilePath (Join-Path $fixture 'StockCount.Server.Desktop.exe') -WorkingDirectory $fixture -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $ui.Refresh()
              if ($ui.HasExited) { throw "Avalonia bundle exited before opening window: $($ui.ExitCode)" }
            } until ($ui.MainWindowHandle -ne 0 -or [DateTime]::UtcNow -ge $deadline)
            if ($ui.MainWindowHandle -eq 0) { throw 'Avalonia UI did not open a window' }
            Write-Host 'Single-file Avalonia UI window opened'
          } finally {
            if ($null -ne $ui) {
              if (-not $ui.HasExited) { $ui.Kill(); $null = $ui.WaitForExit(5000) }
              $ui.Dispose()
            }
            Remove-Item -LiteralPath $fixture -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Verify published API exits after manager process termination
        shell: pwsh
        run: ./tests/ApiManagerLifetime.Smoke.ps1
      - name: Assert branded Windows executable icon was staged
        shell: pwsh
        run: |
          $icon = "src/StockCount.Server.Desktop/Assets/server.ico"
          if (!(Test-Path $icon)) { throw "Avalonia Windows .ico missing" }
          if ((Get-Item $icon).Length -lt 1000) { throw "Avalonia .ico too small" }
          $exe = "publish/avalonia-desktop/StockCount.Server.Desktop.exe"
          if (!(Test-Path $exe)) { throw "Avalonia branded EXE missing" }
      - name: Package and verify Avalonia Windows Portable
        shell: pwsh
        run: |
          ./scripts/package-avalonia-portable.ps1 -OutputDirectory 'dist/avalonia-qa'
          if (-not $?) { throw "Avalonia ZIP packaging failed" }
          $zip = @(Get-ChildItem dist/avalonia-qa -Filter '*-Windows-x64-Portable.zip' -File)
          if ($zip.Count -ne 1) { throw "Expected one Avalonia ZIP" }
          Write-Host "Avalonia Portable QA: $($zip[0].Name)"
      - name: Upload internal QA build
        uses: actions/upload-artifact@v4
        with:
          name: StockCount-Avalonia-Win-x64-Internal-QA
          path: |
            publish/avalonia-desktop/
            dist/avalonia-qa/*.zip
          if-no-files-found: error
          retention-days: 7
