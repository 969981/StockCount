name: StockCount Avalonia desktop Windows build
on:
  push:
    branches: [main, feat/avalonia-server-console-p0-p1]
    paths:
      - 'src/StockCount.Server.Desktop/**'
      - 'src/StockCount.Server.Hosting/**'
      - 'tests/StockCount.Server.Hosting.Tests/**'
      - 'scripts/build-avalonia-desktop.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'scripts/deploy-local.ps1'
      - 'scripts/prepare-windows-brand-icons.ps1'
      - 'assets/branding/**'
      - 'desktop/server-console/assets/app-icon.svg'
      - '.github/workflows/avalonia-server-desktop.yml'
  pull_request:
    paths:
      - 'src/StockCount.Server.Desktop/**'
      - 'src/StockCount.Server.Hosting/**'
      - 'tests/StockCount.Server.Hosting.Tests/**'
      - 'scripts/build-avalonia-desktop.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'scripts/deploy-local.ps1'
      - 'scripts/prepare-windows-brand-icons.ps1'
      - 'assets/branding/**'
      - 'desktop/server-console/assets/app-icon.svg'
      - '.github/workflows/avalonia-server-desktop.yml'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile, test and stage standalone Avalonia desktop plus API
        shell: pwsh
        run: ./scripts/build-avalonia-desktop.ps1 -Configuration Release
      - name: Assert branded Windows executable icon was staged
        shell: pwsh
        run: |
          $icon = "src/StockCount.Server.Desktop/Assets/server.ico"
          if (!(Test-Path $icon)) { throw "Avalonia Windows .ico missing" }
          if ((Get-Item $icon).Length -lt 1000) { throw "Avalonia .ico too small" }
          $exe = "publish/avalonia-desktop/StockCount.Server.Desktop.exe"
          if (!(Test-Path $exe)) { throw "Avalonia branded EXE missing" }
      - name: Package and verify Avalonia Windows Portable
        shell: pwsh
        run: |
          ./scripts/package-avalonia-portable.ps1 -OutputDirectory 'dist/avalonia-qa'
          if (-not $?) { throw "Avalonia ZIP packaging failed" }
          $zip = @(Get-ChildItem dist/avalonia-qa -Filter '*-Windows-x64-Portable.zip' -File)
          if ($zip.Count -ne 1) { throw "Expected one Avalonia ZIP" }
          Write-Host "Avalonia Portable QA: $($zip[0].Name)"
      - name: Upload internal QA build
        uses: actions/upload-artifact@v4
        with:
          name: StockCount-Avalonia-Win-x64-Internal-QA
          path: |
            publish/avalonia-desktop/
            dist/avalonia-qa/*.zip
          if-no-files-found: error
          retention-days: 7
