name: One-time verified cleanup of QA branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-main-only-cleanup.yml'

permissions:
  contents: write

jobs:
  prune-reviewed-qa-branches:
    if: "github.event.head_commit.message == 'chore(branches): [cleanup-only-main] trigger guarded QA branch cleanup'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify main includes merged regression test
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GH_REPO" = '969981/StockCount'
          grep -q 'PendingSubmissionCannotBeRestoredUnderAnotherEnvironment' tests/StockCount.Core.Tests/CountScanWorkflowTests.cs
      - name: Delete exactly seven reviewed QA branch refs with SHA safety checks
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/inspected-branches.txt" <<'BRANCHES'
          qa/android-release-signing-20261123|e7dc39d4d021b72b9d1c7bda5217f2821f2e0df2
          qa/jks-release-powershell-20261123|883c838fae64b28b5eb81eb4c9aa6b84093211b4
          qa/lan-http-pda-20261123|dd6b18c2c166e1da1ad009f3795d6f978f94d50f
          qa/local-powershell-tooling-20261123|5edea75628b609b1134e48dabfd7387afaee8366
          qa/pda-apk-build-verification-20261123|8aaab0f8fea52b95561f1a1531f377e5f8291246
          qa/portable-version-fix-20261123|30b1047c8538282385e012b1914dad0e0cce147a
          qa/release-apk-setup-portable-20261123|5310f5d9da6b952974a9adf5335311febe62ec44
          BRANCHES
          actual_names="$(gh api "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' | sort)"
          expected_names="$( { echo main; cut -d '|' -f 1 "$RUNNER_TEMP/inspected-branches.txt"; } | sort)"
          if [[ "$actual_names" != "$expected_names" ]]; then
            echo 'Branch list changed since inspection; refusing all deletions.' >&2
            diff -u <(echo "$expected_names") <(echo "$actual_names") || true
            exit 1
          fi
          # Check ALL branch tips before any deletion, avoiding partial cleanup on a race.
          while IFS='|' read -r name expected_sha; do
            [[ "$name" == qa/* ]] || { echo "Unexpected branch $name" >&2; exit 1; }
            actual_sha="$(gh api "repos/$GH_REPO/branches/$name" --jq '.commit.sha')"
            [[ "$actual_sha" == "$expected_sha" ]] || { echo "Branch $name advanced; aborting" >&2; exit 1; }
          done < "$RUNNER_TEMP/inspected-branches.txt"
          while IFS='|' read -r name expected_sha; do
            echo "Deleting reviewed branch: $name"
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$name"
          done < "$RUNNER_TEMP/inspected-branches.txt"
          remaining="$(gh api "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')"
          if [[ "$remaining" != main ]]; then
            echo "Remaining branches do not match expected main-only state: $remaining" >&2
            exit 1
          fi
          echo 'SUCCESS: main is the only remaining remote branch.'
