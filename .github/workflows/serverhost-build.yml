name: StockCount ServerHost Windows Build
on:
  push:
    branches: [main]
    paths:
      - 'src/StockCount.ServerHost/**'
      - 'src/StockCount.Api/**'
      - 'src/StockCount.Core/**'
      - 'src/StockCount.Contracts/**'
      - 'src/StockCount.Infrastructure/**'
      - 'StockCount.ServerHost.slnx'
      - '.github/workflows/serverhost-build.yml'
  pull_request:
    paths:
      - 'src/StockCount.ServerHost/**'
      - 'src/StockCount.Api/**'
      - 'src/StockCount.Core/**'
      - 'src/StockCount.Contracts/**'
      - 'src/StockCount.Infrastructure/**'
      - 'StockCount.ServerHost.slnx'
      - '.github/workflows/serverhost-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore WPF + ASP.NET projects
        run: dotnet restore StockCount.ServerHost.slnx
      - name: Compile WPF ServerHost
        run: dotnet build StockCount.ServerHost.slnx -c Release --no-restore
      - name: Publish self-contained Windows x64
        run: dotnet publish src/StockCount.ServerHost/StockCount.ServerHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/serverhost
      - uses: actions/upload-artifact@v4
        with:
          name: StockCount-ServerHost-win-x64
          path: publish/serverhost/
          if-no-files-found: error
          retention-days: 14
