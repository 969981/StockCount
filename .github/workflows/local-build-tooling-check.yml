name: Validate local PowerShell build, deploy and source packaging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-local.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'scripts/get-app-version.ps1'
      - 'scripts/set-app-version.ps1'
      - 'scripts/build-android-release.ps1'
      - 'scripts/new-android-release-jks.ps1'
      - 'scripts/configure-android-release-secrets.ps1'
      - 'scripts/publish-stockcount-release.ps1'
      - 'scripts/deploy-local.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'scripts/package-source.ps1'
      - 'scripts/build-avalonia-desktop.ps1'
      - 'StockCount.slnx'
      - 'StockCount.Backend.slnx'
      - 'src/StockCount.Server.Desktop/**'
      - 'src/StockCount.Server.Hosting/**'
      - 'src/StockCount.Pad/**'
      - 'src/StockCount.Api/Properties/launchSettings.json'
      - 'scripts/package-windows-portable.ps1'
      - 'tests/LocalTooling.Smoke.ps1'
      - 'tests/BrandIcons.Smoke.ps1'
      - 'assets/branding/**'
      - 'scripts/prepare-windows-brand-icons.ps1'
      - 'desktop/server-console/assets/app-icon.svg'
      - 'src/StockCount.Pad/Resources/AppIcon/**'
      - 'src/StockCount.Pad/Platforms/Android/AndroidManifest.xml'
      - 'scripts/verify-android-launcher-icon.ps1'
      - 'scripts/verify-android-feedback-audio.ps1'
      - 'scripts/generate-android-feedback-gain.ps1'
      - 'scripts/restore-ffmpeg.ps1'
      - 'tools/ffmpeg.lock.json'
      - 'docs/LOCAL_BUILD_DEPLOY.md'
      - '.github/workflows/local-build-tooling-check.yml'
  pull_request:
    paths:
      - 'scripts/build-local.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'scripts/get-app-version.ps1'
      - 'scripts/set-app-version.ps1'
      - 'scripts/build-android-release.ps1'
      - 'scripts/new-android-release-jks.ps1'
      - 'scripts/configure-android-release-secrets.ps1'
      - 'scripts/publish-stockcount-release.ps1'
      - 'scripts/deploy-local.ps1'
      - 'scripts/package-avalonia-portable.ps1'
      - 'scripts/deploy-avalonia-portable.ps1'
      - 'scripts/package-source.ps1'
      - 'scripts/build-avalonia-desktop.ps1'
      - 'StockCount.slnx'
      - 'StockCount.Backend.slnx'
      - 'src/StockCount.Server.Desktop/**'
      - 'src/StockCount.Server.Hosting/**'
      - 'src/StockCount.Pad/**'
      - 'src/StockCount.Api/Properties/launchSettings.json'
      - 'scripts/package-windows-portable.ps1'
      - 'tests/LocalTooling.Smoke.ps1'
      - 'tests/BrandIcons.Smoke.ps1'
      - 'assets/branding/**'
      - 'scripts/prepare-windows-brand-icons.ps1'
      - 'desktop/server-console/assets/app-icon.svg'
      - 'src/StockCount.Pad/Resources/AppIcon/**'
      - 'src/StockCount.Pad/Platforms/Android/AndroidManifest.xml'
      - 'scripts/verify-android-launcher-icon.ps1'
      - 'scripts/verify-android-feedback-audio.ps1'
      - 'scripts/generate-android-feedback-gain.ps1'
      - 'scripts/restore-ffmpeg.ps1'
      - 'tools/ffmpeg.lock.json'
      - 'docs/LOCAL_BUILD_DEPLOY.md'
      - '.github/workflows/local-build-tooling-check.yml'

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify PowerShell 7 syntax for local tooling
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts/build-local.ps1',
            'scripts/package-avalonia-portable.ps1',
            'scripts/deploy-avalonia-portable.ps1',
            'scripts/get-app-version.ps1',
            'scripts/set-app-version.ps1',
            'scripts/build-android-release.ps1',
            'scripts/new-android-release-jks.ps1',
            'scripts/configure-android-release-secrets.ps1',
            'scripts/publish-stockcount-release.ps1',
            'scripts/deploy-local.ps1',
            'scripts/package-source.ps1',
            'scripts/verify-android-launcher-icon.ps1',
            'scripts/verify-android-feedback-audio.ps1',
            'scripts/generate-android-feedback-gain.ps1',
            'scripts/restore-ffmpeg.ps1',
            'scripts/build-avalonia-desktop.ps1',
            'scripts/build-tauri-sidecar.ps1',
            'scripts/package-windows-portable.ps1',
            'scripts/prepare-windows-brand-icons.ps1',
            'tests/BrandIcons.Smoke.ps1',
            'tests/LocalTooling.Smoke.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "PowerShell parser errors found in $script"
            }
            Write-Host "Syntax OK: $script"
          }
      - name: Validate icon vectors, sizes, and platform bindings
        run: ./tests/BrandIcons.Smoke.ps1
      - name: Portable upgrade and reproducible source ZIP smoke tests
        run: ./tests/LocalTooling.Smoke.ps1
      - name: Verify generated source package checksum
        run: |
          $commit = (& git rev-parse HEAD).Trim()
          $short = (& git rev-parse --short=7 $commit).Trim()
          $base = "dist/ci-source-test/StockCount-Source-$short"
          $path = "$base.zip"
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $text = Get-Content "$base.SHA256SUMS.txt" -Raw
          if (-not $text.StartsWith($hash)) { throw 'Source ZIP checksum mismatch.' }
          Write-Host "Verified source ZIP SHA256: $hash"
