name: Validate local PowerShell build, deploy and source packaging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-local.ps1'
      - 'scripts/build-android-release.ps1'
      - 'scripts/deploy-local.ps1'
      - 'scripts/package-source.ps1'
      - 'scripts/package-windows-portable.ps1'
      - 'tests/LocalTooling.Smoke.ps1'
      - 'docs/LOCAL_BUILD_DEPLOY.md'
      - '.github/workflows/local-build-tooling-check.yml'
  pull_request:
    paths:
      - 'scripts/build-local.ps1'
      - 'scripts/build-android-release.ps1'
      - 'scripts/deploy-local.ps1'
      - 'scripts/package-source.ps1'
      - 'scripts/package-windows-portable.ps1'
      - 'tests/LocalTooling.Smoke.ps1'
      - 'docs/LOCAL_BUILD_DEPLOY.md'
      - '.github/workflows/local-build-tooling-check.yml'

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify PowerShell 7 syntax for local tooling
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts/build-local.ps1',
            'scripts/build-android-release.ps1',
            'scripts/deploy-local.ps1',
            'scripts/package-source.ps1',
            'scripts/build-tauri-sidecar.ps1',
            'scripts/package-windows-portable.ps1',
            'tests/LocalTooling.Smoke.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "PowerShell parser errors found in $script"
            }
            Write-Host "Syntax OK: $script"
          }
      - name: Portable upgrade and reproducible source ZIP smoke tests
        run: ./tests/LocalTooling.Smoke.ps1
      - name: Verify generated source package checksum
        run: |
          $path = 'dist/ci-source-test/StockCount-Source-v0.2.0-local.zip'
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $text = Get-Content 'dist/ci-source-test/StockCount-Source-v0.2.0-local.SHA256SUMS.txt' -Raw
          if (-not $text.StartsWith($hash)) { throw 'Source ZIP checksum mismatch.' }
          Write-Host "Verified source ZIP SHA256: $hash"
