name: StockCount Tauri Server Console (Windows)
# User-authorized v0.1.0-preview.1 publish request: app-adjacent server-logs.db.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/server-console/**'
      - 'assets/branding/**'
      - 'src/StockCount.Api/**'
      - 'src/StockCount.Infrastructure/**'
      - 'src/StockCount.Contracts/**'
      - 'src/StockCount.Core/**'
      - 'scripts/build-tauri-sidecar.ps1'
      - '.github/workflows/tauri-server-console.yml'
  pull_request:
    paths:
      - 'desktop/server-console/**'
      - 'assets/branding/**'
      - 'src/StockCount.Api/**'
      - 'src/StockCount.Infrastructure/**'
      - 'src/StockCount.Contracts/**'
      - 'src/StockCount.Core/**'
      - 'scripts/build-tauri-sidecar.ps1'
      - '.github/workflows/tauri-server-console.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build C# API
        run: dotnet build src/StockCount.Api/StockCount.Api.csproj -c Release
      - name: Publish API sidecar
        run: ./scripts/build-tauri-sidecar.ps1
      - name: Install desktop dependencies
        working-directory: desktop/server-console
        run: npm install
      - name: Generate desktop icons from SVG
        working-directory: desktop/server-console
        run: npm run tauri -- icon ./assets/app-icon.svg
      - name: Build frontend
        working-directory: desktop/server-console
        run: npm run build
      - name: Bundle NSIS installer
        working-directory: desktop/server-console
        run: npm run build:desktop
      - name: Test Rust config migration and local-file precedence
        working-directory: desktop/server-console/src-tauri
        run: cargo test --lib --release -- config::tests
      - uses: actions/upload-artifact@v4
        with:
          name: StockCount-Tauri-ServerConsole-Windows
          path: desktop/server-console/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # A release is published only when the last pushed commit contains the marker
  # [publish-server-console]. All installers must first build successfully.
  release-preview:
    name: Publish Windows preview to GitHub Releases
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-server-console]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StockCount-Tauri-ServerConsole-Windows
          path: release-files
      - name: Verify installer and compute SHA256
        shell: bash
        run: |
          shopt -s nullglob
          installers=(release-files/*.exe)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows NSIS installer was produced" >&2
            exit 1
          fi
          cd release-files
          sha256sum ./*.exe > SHA256SUMS.txt
      - name: Create GitHub prerelease with Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: v0.1.0-preview.1
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Preview tag already exists; refusing to silently overwrite immutable release." >&2
            exit 1
          fi
          gh release create "$TAG_NAME" release-files/*.exe release-files/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --target "$SOURCE_SHA" \
            --title "StockCount Server Console v0.1.0 Preview 1 (Windows x64)" \
            --prerelease \
            --notes "Windows Tauri 2 + React management UI, ASP.NET Core 10 C# Sidecar, SQLite logs beside the desktop EXE, secure local SQL configuration. Pre-release for XTEST/read-only validation only; no Sage X3 production writes. Unsigned installer: verify SHA256SUMS before running."
