name: Cleanup verified merged branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-merged-pr29-branch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only explicitly requested branches already merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_tip="$(git rev-parse FETCH_HEAD)"
          failed=0
          while read -r branch expected; do
            ref="refs/heads/$branch"
            test "$branch" != main
            current="$(git ls-remote --heads origin "$ref" | cut -f1)"
            if [ -z "$current" ]; then
              echo "$branch already absent"
              continue
            fi
            if [ "$current" != "$expected" ] || ! git merge-base --is-ancestor "$expected" "$main_tip"; then
              echo "$branch changed or not merged; refusing deletion"
              failed=1
              continue
            fi
            if ! git push --force-with-lease="$ref:$expected" origin ":$ref"; then
              failed=1
              continue
            fi
            if [ -n "$(git ls-remote --heads origin "$ref")" ]; then failed=1; fi
          done <<'BRANCHES'
          feat/pda-compact-counting-layout fd5a286be370c1d88ce74afe2f13ad4b783772a7
          fix/allow-all-count-statuses 03cf522057e0320858e122a9ee496200a646e83f
          fix/box-qr-classification 113900640f9e486880c81bb91574238d67041827
          fix/count-stock-unit-mapping 067ebe3ea19287d478de4a252a5748c7b45dbb29
          fix/pda-nonblocking-success-toast fbec7ab819ef2b37108ad40b0ef7ef5d1947f473
          fix/submit-sql-diagnostics-and-log-copy 38a8b652c4042db6f29397eb67fec69f8d2d24b7
          perf/pda-client-hotpath 68f14d53b32c3431a08d48ae5b9db71d1d2637ec
          BRANCHES
          git ls-remote --heads origin
          exit "$failed"
