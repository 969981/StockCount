name: Cleanup verified merged branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-merged-pr29-branch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only explicitly requested branches already merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_tip="$(git rev-parse FETCH_HEAD)"
          failed=0
          while read -r branch expected; do
            ref="refs/heads/$branch"
            test "$branch" != main
            current="$(git ls-remote --heads origin "$ref" | cut -f1)"
            if [ -z "$current" ]; then
              echo "$branch already absent"
              continue
            fi
            if [ "$current" != "$expected" ] || ! git merge-base --is-ancestor "$expected" "$main_tip"; then
              echo "$branch changed or not merged; refusing deletion"
              failed=1
              continue
            fi
            if ! git push --force-with-lease="$ref:$expected" origin ":$ref"; then
              failed=1
              continue
            fi
            if [ -n "$(git ls-remote --heads origin "$ref")" ]; then failed=1; fi
          done <<'BRANCHES'
          fix/pda-keyboard-submit-toast cae57c720b5d7bfe9e583a9e1db17b7367fd8069
          BRANCHES
          git ls-remote --heads origin
          exit "$failed"
