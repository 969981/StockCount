name: StockCount MAUI PDA Android Debug + Release Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/StockCount.Pad/**'
      - 'assets/branding/**'
      - 'StockCount.slnx'
      - 'StockCount.Backend.slnx'
      - 'src/StockCount.Api/Properties/launchSettings.json'
      - 'src/StockCount.Server.Desktop/StockCount.Server.Desktop.csproj'
      - 'scripts/build-android-release.ps1'
      - 'scripts/verify-android-launcher-icon.ps1'
      - 'scripts/verify-android-feedback-audio.ps1'
      - 'scripts/generate-android-feedback-gain.ps1'
      - 'scripts/restore-ffmpeg.ps1'
      - 'tools/ffmpeg.lock.json'
      - 'docs/pda/audio-feedback/**'
      - 'src/StockCount.Core/**'
      - 'src/StockCount.Contracts/**'
      - 'tests/StockCount.Core.Tests/**'
      - '.github/workflows/pda-android-build.yml'
  pull_request:
    paths:
      - 'src/StockCount.Pad/**'
      - 'assets/branding/**'
      - 'StockCount.slnx'
      - 'StockCount.Backend.slnx'
      - 'src/StockCount.Api/Properties/launchSettings.json'
      - 'src/StockCount.Server.Desktop/StockCount.Server.Desktop.csproj'
      - 'scripts/build-android-release.ps1'
      - 'scripts/verify-android-launcher-icon.ps1'
      - 'scripts/verify-android-feedback-audio.ps1'
      - 'scripts/generate-android-feedback-gain.ps1'
      - 'scripts/restore-ffmpeg.ps1'
      - 'tools/ffmpeg.lock.json'
      - 'docs/pda/audio-feedback/**'
      - 'src/StockCount.Core/**'
      - 'src/StockCount.Contracts/**'
      - 'tests/StockCount.Core.Tests/**'
      - '.github/workflows/pda-android-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android
      - name: Cache pinned FFmpeg build tool
        uses: actions/cache@v4
        with:
          path: .tools/ffmpeg
          key: ${{ runner.os }}-stockcount-ffmpeg-${{ hashFiles('tools/ffmpeg.lock.json') }}
      - name: Generate limited feedback audio profiles
        shell: pwsh
        run: ./scripts/generate-android-feedback-gain.ps1
      - name: Restore Android project
        run: dotnet restore src/StockCount.Pad/StockCount.Pad.csproj
      - name: Verify explicit MAUI Controls reference and restored assembly package
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/StockCount.Pad/StockCount.Pad.csproj' -Raw
          $reference = @($project.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq 'Microsoft.Maui.Controls' })
          if ($reference.Count -ne 1 -or [string]::IsNullOrWhiteSpace($reference[0].Version)) {
            throw 'Explicit Microsoft.Maui.Controls package reference is required for MAUI XAML.'
          }
          $assets = Get-Content 'src/StockCount.Pad/obj/project.assets.json' -Raw | ConvertFrom-Json -AsHashtable
          if (!@($assets.libraries.Keys | Where-Object { $_ -match '^Microsoft\.Maui\.Controls/10\.' }).Count) {
            throw 'MAUI 10 Controls package was not restored.'
          }
      - name: Run pure scanning/unit tests
        run: dotnet test tests/StockCount.Core.Tests/StockCount.Core.Tests.csproj -c Release
      - name: Build stand-alone Android debug APK
        run: dotnet build src/StockCount.Pad/StockCount.Pad.csproj -f net10.0-android -c Debug --no-restore -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
      - name: Verify the complete Visual Studio solution (Backend + Avalonia + Android)
        shell: pwsh
        run: |
          dotnet build StockCount.slnx -c Debug
          if ($LASTEXITCODE -ne 0) { throw 'Full Visual Studio solution build failed' }
          $settings = Get-Content 'src/StockCount.Api/Properties/launchSettings.json' -Raw | ConvertFrom-Json
          if ($settings.profiles.'StockCount.Api (HTTP)'.applicationUrl -ne 'http://127.0.0.1:5080') {
            throw 'API Visual Studio startup must be HTTP-only on 127.0.0.1:5080'
          }
          if (!(Test-Path 'src/StockCount.Server.Desktop/bin/Debug/net10.0-windows/StockCount.Api.exe')) {
            throw 'Avalonia Visual Studio Debug did not stage StockCount.Api.exe'
          }
      - name: Verify Android adaptive launcher source layers
        shell: pwsh
        run: |
          $project = Get-Content "src/StockCount.Pad/StockCount.Pad.csproj" -Raw
          if ($project -notmatch "Resources/AppIcon/appicon.svg") { throw "MauiIcon lost" }
          [xml]$svg = Get-Content "src/StockCount.Pad/Resources/AppIcon/appicon.svg" -Raw
          if ($svg.svg.viewBox -ne "0 0 512 512") { throw "StockCount PDA SVG invalid" }
          ./tests/BrandIcons.Smoke.ps1
      - name: Verify generated APK is present
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src/StockCount.Pad/bin/Debug/net10.0-android' -Recurse -File -Filter '*.apk')
          if ($files.Count -eq 0) { throw 'Build produced no APK' }
          $files | ForEach-Object {
            Write-Host ("APK: " + $_.FullName + " (" + $_.Length + " bytes)")
            Get-FileHash $_.FullName -Algorithm SHA256 | Format-List
          }
      - name: Verify actual Debug APK launcher resources
        shell: pwsh
        run: |
          $apks = @(Get-ChildItem 'src/StockCount.Pad/bin/Debug/net10.0-android' -File -Filter '*-Signed.apk')
          if ($apks.Count -ne 1) { throw 'Expected exactly one signed Debug APK' }
          ./scripts/verify-android-launcher-icon.ps1 -ApkPath $apks[0].FullName
          ./scripts/verify-android-feedback-audio.ps1 -ApkPath $apks[0].FullName
      - name: Upload installable Android APK (debug signed for testing)
        uses: actions/upload-artifact@v4
        with:
          name: StockCount-PDA-Android-Debug-APK
          path: src/StockCount.Pad/bin/Debug/net10.0-android/**/*-Signed.apk
          if-no-files-found: error
          retention-days: 14
      - name: Detect Android Release signing secrets
        id: release_signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.STOCKCOUNT_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_ALIAS: ${{ secrets.STOCKCOUNT_ANDROID_KEY_ALIAS }}
          STOCKCOUNT_ANDROID_STORE_PASS: ${{ secrets.STOCKCOUNT_ANDROID_STORE_PASS }}
          STOCKCOUNT_ANDROID_KEY_PASS: ${{ secrets.STOCKCOUNT_ANDROID_KEY_PASS }}
        run: |
          $ready = -not [string]::IsNullOrWhiteSpace($env:RELEASE_KEYSTORE_B64) -and
                   -not [string]::IsNullOrWhiteSpace($env:RELEASE_ALIAS) -and
                   -not [string]::IsNullOrWhiteSpace($env:STOCKCOUNT_ANDROID_STORE_PASS) -and
                   -not [string]::IsNullOrWhiteSpace($env:STOCKCOUNT_ANDROID_KEY_PASS)
          "configured=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $ready) { Write-Warning "No persistent release keystore configured: Release code is compiled, but a signed Release APK cannot be uploaded." }
      - name: Compile Android Release configuration (without distribution signing)
        if: steps.release_signing.outputs.configured != 'true'
        shell: pwsh
        run: |
          dotnet build src/StockCount.Pad/StockCount.Pad.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -p:AndroidKeyStore=false
          if ($LASTEXITCODE -ne 0) { throw "Android Release compilation failed" }
          $apks = @(Get-ChildItem 'src/StockCount.Pad/bin/Release/net10.0-android' -File -Filter '*-Signed.apk')
          if ($apks.Count -ne 1) { throw 'Expected one Release QA APK' }
          ./scripts/verify-android-launcher-icon.ps1 -ApkPath $apks[0].FullName
          ./scripts/verify-android-feedback-audio.ps1 -ApkPath $apks[0].FullName
      - name: Publish and verify signed Android Release APK
        if: steps.release_signing.outputs.configured == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.STOCKCOUNT_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_ALIAS: ${{ secrets.STOCKCOUNT_ANDROID_KEY_ALIAS }}
          STOCKCOUNT_ANDROID_STORE_PASS: ${{ secrets.STOCKCOUNT_ANDROID_STORE_PASS }}
          STOCKCOUNT_ANDROID_KEY_PASS: ${{ secrets.STOCKCOUNT_ANDROID_KEY_PASS }}
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP 'stockcount-release.jks'
          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:RELEASE_KEYSTORE_B64))
            ./scripts/build-android-release.ps1 -Version 0.2.0-preview.3 -KeyStore $keystore -KeyAlias $env:RELEASE_ALIAS -OutputDirectory release-android
            $apks = @(Get-ChildItem 'release-android' -File -Filter '*-Android-Release-Signed.apk')
            if ($apks.Count -ne 1) { throw 'Expected one signed distribution APK' }
            ./scripts/verify-android-feedback-audio.ps1 -ApkPath $apks[0].FullName
          } finally {
            Remove-Item -LiteralPath $keystore -Force -ErrorAction SilentlyContinue
          }
      - name: Upload signed Release APK
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StockCount-PDA-Android-Release-Signed-APK
          path: release-android/*-Android-Release-Signed.apk
          if-no-files-found: error
          retention-days: 14
