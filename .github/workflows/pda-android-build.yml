name: StockCount MAUI PDA Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/StockCount.Pad/**'
      - 'src/StockCount.Core/**'
      - 'src/StockCount.Contracts/**'
      - 'tests/StockCount.Core.Tests/**'
      - '.github/workflows/pda-android-build.yml'
  pull_request:
    paths:
      - 'src/StockCount.Pad/**'
      - 'src/StockCount.Core/**'
      - 'src/StockCount.Contracts/**'
      - 'tests/StockCount.Core.Tests/**'
      - '.github/workflows/pda-android-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore Android project
        run: dotnet restore src/StockCount.Pad/StockCount.Pad.csproj
      - name: Run pure scanning/unit tests
        run: dotnet test tests/StockCount.Core.Tests/StockCount.Core.Tests.csproj -c Release
      - name: Build stand-alone Android debug APK
        run: dotnet build src/StockCount.Pad/StockCount.Pad.csproj -f net10.0-android -c Debug --no-restore -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
      - name: Verify generated APK is present
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src/StockCount.Pad/bin/Debug/net10.0-android' -Recurse -File -Filter '*.apk')
          if ($files.Count -eq 0) { throw 'Build produced no APK' }
          $files | ForEach-Object {
            Write-Host ("APK: " + $_.FullName + " (" + $_.Length + " bytes)")
            Get-FileHash $_.FullName -Algorithm SHA256 | Format-List
          }
      - name: Upload installable Android APK (debug signed for testing)
        uses: actions/upload-artifact@v4
        with:
          name: StockCount-PDA-Android-Debug-APK
          path: src/StockCount.Pad/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14
